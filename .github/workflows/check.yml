name: Check HeadTap
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6
      - run: deno test --node-modules-dir=none --allow-env tests/backend.test.ts
